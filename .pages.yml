
media:
  input: images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif]
  rename: safe

content:
  - name: homepage
    label: Homepage e biografia
    type: file
    path: data/site.json
    format: json
    fields:
      - name: menu_items
        label: Menu principale
        type: object
        list: true
        fields:
          - name: label
            label: Nome della voce
            type: string
            required: true
          - name: url
            label: Collegamento
            type: string
            required: true
            description: "Esempio: #work, #festivals, #about oppure un indirizzo https://..."
          - name: visible
            label: Visibile nel menu
            type: boolean

      - {"name": "professional_label", "label": "Etichetta professionale", "type": "string"}
      - {"name": "hero_title_font", "label": "Nome principale - Font", "type": "select", "options": {"values": [{"name": "Manrope", "label": "Manrope"}, {"name": "DM Sans", "label": "DM Sans"}, {"name": "Georgia", "label": "Georgia"}]}}
      - {"name": "hero_title_size", "label": "Nome principale - Dimensione massima (px)", "type": "number", "options": {"min": 60, "max": 260}}
      - {"name": "hero_title_spacing", "label": "Nome principale - Spaziatura (em)", "type": "string"}
      - {"name": "hero_kicker", "label": "Frase di apertura", "type": "string"}
      - {"name": "hero_subtitle", "label": "Sottotitolo principale", "type": "text"}
      - {"name": "hero_image", "label": "Immagine grande in homepage", "type": "image"}
      - {"name": "intro_title_line_1", "label": "Titolo film - Prima riga", "type": "string"}
      - {"name": "intro_title_line_2", "label": "Titolo film - Seconda riga", "type": "string"}
      - {"name": "intro_text", "label": "Presentazione dei film", "type": "text"}
      - {"name": "manifesto_line_1", "label": "Manifesto - Prima riga", "type": "string"}
      - {"name": "manifesto_line_2", "label": "Manifesto - Seconda riga", "type": "string"}
      - {"name": "manifesto_font", "label": "Manifesto - Carattere", "type": "select", "options": {"values": [{"name": "Manrope", "label": "Manrope - Originale"}, {"name": "DM Sans", "label": "DM Sans - Moderno"}, {"name": "Georgia", "label": "Georgia - Editoriale"}]}}
      - {"name": "manifesto_size", "label": "Manifesto - Dimensione massima (px)", "type": "number", "options": {"min": 30, "max": 120}}
      - {"name": "manifesto_spacing", "label": "Manifesto - Spaziatura lettere (em)", "type": "string"}
      - {"name": "manifesto_emphasis", "label": "Manifesto - Ultima parola in corsivo", "type": "boolean"}
      - {"name": "contact_kicker", "label": "Contatti - Frase piccola", "type": "string"}
      - {"name": "contact_line_1", "label": "Contatti - Prima riga", "type": "string"}
      - {"name": "contact_line_2", "label": "Contatti - Seconda riga", "type": "string"}
      - {"name": "contact_kicker_size", "label": "Contatti - Dimensione frase piccola (px, 0 = originale)", "type": "number", "options": {"min": 0, "max": 100}}
      - {"name": "contact_line_1_size", "label": "Contatti - Dimensione prima riga (px, 0 = originale)", "type": "number", "options": {"min": 0, "max": 200}}
      - {"name": "contact_line_2_size", "label": "Contatti - Dimensione seconda riga (px, 0 = originale)", "type": "number", "options": {"min": 0, "max": 200}}
      - {"name": "about_paragraph_1", "label": "Biografia - paragrafo 1", "type": "text"}
      - {"name": "about_paragraph_2", "label": "Biografia - paragrafo 2", "type": "text"}
      - {"name": "about_paragraph_3", "label": "Biografia - paragrafo 3", "type": "text"}
      - {"name": "contact_email", "label": "Email di contatto", "type": "string"}
      - {"name": "youtube_url", "label": "Link YouTube generale", "type": "string"}

  - name: films
    label: Film e progetti
    type: file
    path: data/films.json
    format: json
    list: true
    fields:
      - {"name": "slug", "label": "Identificativo del film", "type": "string", "required": true}
      - {"name": "title", "label": "Titolo", "type": "string", "required": true}
      - {"name": "category", "label": "Categoria", "type": "string"}
      - {"name": "description", "label": "Sinossi", "type": "text"}
      - {"name": "year", "label": "Anno", "type": "string"}
      - {"name": "format", "label": "Durata e formato", "type": "string"}
      - {"name": "video_url", "label": "Link video YouTube", "type": "string"}
      - {"name": "image", "label": "Fotogramma o locandina", "type": "image"}
      - {"name": "homepage_label", "label": "Etichetta homepage", "type": "string"}
      - {"name": "homepage_kicker", "label": "Sottotitolo breve", "type": "string"}
      - {"name": "homepage_subtitle", "label": "Descrizione breve", "type": "string"}
      - {"name": "visible", "label": "Visibile nella homepage", "type": "boolean"}

  - name: festivals
    label: Festival e candidature
    type: file
    path: data/festivals.json
    format: json
    list: true
    fields:
      - name: festival
        label: Nome del festival
        type: string
        required: true

      - name: film
        label: Nome del film
        type: string
        required: true

      - name: date
        label: Anno
        type: string
        description: "Inserisci solo l'anno, es. 2026"

      - name: country
        label: Paese
        type: string

      - name: status
        label: Stato della candidatura
        type: select
        options:
          values:
            - name: Submitted
              label: Candidatura inviata
            - name: Under Consideration
              label: In valutazione
            - name: Official Selection
              label: Selezione ufficiale
            - name: Special Event
              label: Evento speciale
            - name: Finalist
              label: Finalista
            - name: Award Winner
              label: Premio ricevuto
            - name: Not Selected
              label: Non selezionato

      - name: url
        label: Link del festival
        type: string

      - name: notes
        label: Note
        type: text

